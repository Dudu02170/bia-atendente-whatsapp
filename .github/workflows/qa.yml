name: QA Java
on:
  pull_request:
  push:
    branches: [main, qa/test-automation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Docker runtime
        run: docker info
      - name: Testes Java, filtro isolado e PostgreSQL descartavel
        working-directory: qa
        run: mvn --batch-mode --no-transfer-progress test
      - name: Relatorios JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: qa/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
